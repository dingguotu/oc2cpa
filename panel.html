<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OC2CPA 用量面板</title>
<link rel="icon" type="image/svg+xml" href="https://opencode.ai/favicon.svg">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e5e7eb; --text: #1f2328;
    --muted: #6b7280; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
    --chip: #eef2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 18px 60px; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: none; border-radius: 0; padding: 6px 12px; background: transparent; }
  .seg button.active { background: var(--accent); color: #fff; }
  .filters select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); max-width: 300px; }
  .filters .hint { color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px;
           padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  label.auto { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
  th, td { padding: 8px 12px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  thead th { background: #fafbfc; font-weight: 600; color: var(--muted); font-size: 12px; border-top: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .chip { display: inline-block; background: var(--chip); color: var(--accent); border-radius: 999px;
          padding: 1px 10px; font-size: 11px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .banner { display: none; background: #fef2f2; color: var(--bad); border: 1px solid #fecaca;
            border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .keyform { display: none; max-width: 420px; margin: 60px auto 0; background: var(--card);
             border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .keyform h2 { margin-top: 0; }
  .keyform input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
                   border-radius: 8px; margin: 10px 0 14px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .time { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>OC2CPA 用量面板</h1>
      <div class="sub" id="gen-at">数据为宿主进程本次运行期间的内存记录</div>
    </div>
    <div class="spacer"></div>
    <label class="auto"><input type="checkbox" id="auto" checked> 自动刷新（10s）</label>
    <button id="refresh">刷新</button>
  </header>

  <div class="banner" id="banner"></div>

  <div id="content" style="display:none">
    <div class="filters">
      <div class="seg" id="seg-range">
        <button type="button" data-range="today">今天</button>
        <button type="button" data-range="7d">近7天</button>
        <button type="button" data-range="30d">近30天</button>
        <button type="button" data-range="all">全部</button>
      </div>
      <select id="f-model"><option value="">全部模型</option></select>
      <label class="auto"><input type="checkbox" id="f-failed"> 仅看失败</label>
      <span class="hint" id="filter-hint"></span>
    </div>

    <div class="cards">
      <div class="card"><div class="k">请求总数</div><div class="v" id="c-req">–</div><div class="s" id="c-req-today">今日 –</div></div>
      <div class="card"><div class="k">成功率</div><div class="v" id="c-rate">–</div><div class="s" id="c-rate-today">今日 –</div></div>
      <div class="card"><div class="k">输入 tokens</div><div class="v" id="c-in">–</div><div class="s" id="c-in-today">今日 –</div></div>
      <div class="card"><div class="k">输出 tokens</div><div class="v" id="c-out">–</div><div class="s" id="c-out-today">今日 –</div></div>
      <div class="card"><div class="k">总 tokens</div><div class="v" id="c-total">–</div><div class="s" id="c-total-today">今日 –</div></div>
    </div>

    <h2>按模型统计</h2>
    <table id="models"><thead>
      <tr><th>模型</th><th>请求</th><th>成功</th><th>失败</th><th>输入</th><th>输出</th>
          <th>思考</th><th>缓存</th><th>总计</th><th>最近使用</th></tr>
    </thead><tbody></tbody></table>

    <h2>最近请求</h2>
    <table id="records"><thead>
      <tr><th>时间</th><th>模型</th><th>类型</th><th>状态</th><th>输入</th><th>输出</th>
          <th>总计</th><th>延迟</th><th>首字</th><th>调用方</th></tr>
    </thead><tbody></tbody></table>
  </div>

  <form class="keyform" id="keyform">
    <h2>需要管理密钥</h2>
    <div style="color:var(--muted)">数据接口受 CLIProxyAPI 管理密钥保护。从管理界面打开时通常无需输入；独立打开时请输入一次（仅保存在本次会话）。</div>
    <input type="password" id="key" placeholder="management key">
    <button type="submit" style="width:100%">保存并加载</button>
  </form>
</div>

<script>
/* ---------- management key acquisition (3 fallbacks, zero config) ----------
   Same approach as the codebuddy plugin panel:
   1) When embedded in the CPA management UI (same-origin iframe), read the
      UI's own localStorage "cli-proxy-auth" (XOR+base64 "enc::v1::" format),
      so opening the panel from the sidebar needs no key at all.
   2) ?key= URL param (cleaned from history after read, kept in sessionStorage).
   3) Manual input (sessionStorage only, never persisted). */
const API = "/v0/management/plugins/oc2cpa";
const $ = id => document.getElementById(id);
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = "oc2cpa-mgmt-key";
const FILTERS_KEY = "oc2cpa-filters";
const RANGE_LABELS = { today: "今天", "7d": "近7天", "30d": "近30天", all: "全部" };

/* ---------- panel filters (session-persistent) ----------------------------
   range: today | 7d | 30d | all; model: exact model/alias; failed: failures
   only. All three are passed to the server-side filter on every request. */
let filters = (function () {
  try {
    const s = JSON.parse(sessionStorage.getItem(FILTERS_KEY));
    if (s && RANGE_LABELS[s.range]) return { range: s.range, model: String(s.model || ""), failed: !!s.failed };
  } catch (e) {}
  return { range: "today", model: "", failed: false };
})();
const saveFilters = () => { try { sessionStorage.setItem(FILTERS_KEY, JSON.stringify(filters)); } catch (e) {} };
function filterQuery(extra) {
  const p = new URLSearchParams();
  p.set("range", filters.range);
  if (filters.model) p.set("model", filters.model);
  if (filters.failed) p.set("status", "failed");
  for (const [k, v] of Object.entries(extra || {})) p.set(k, v);
  const s = p.toString();
  return s ? "?" + s : "";
}
function filterLabel() {
  const parts = [RANGE_LABELS[filters.range] || filters.range];
  if (filters.model) parts.push(filters.model);
  if (filters.failed) parts.push("仅失败");
  return parts.join(" · ");
}
function syncFilterUI() {
  for (const btn of $('seg-range').children) btn.classList.toggle('active', btn.dataset.range === filters.range);
  $('f-failed').checked = filters.failed;
  $('f-model').value = filters.model;
}

function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64e(b){let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function readUrlKey(){
  const m=new URLSearchParams(window.location.search).get("key");
  if(m){
    try{sessionStorage.setItem(SS_KEY,m)}catch(e){}
    history.replaceState(null,"",window.location.pathname);
  }
  return m;
}
function getKey(){
  try{
    const ss=sessionStorage.getItem(SS_KEY);
    if(ss)return ss;
  }catch(e){}
  const stored=readPanelKey();
  if(stored)return stored;
  return readUrlKey();
}
function headers() {
  const h = {};
  const key = getKey();
  if (key) h["Authorization"] = "Bearer " + key;
  return h;
}
const fmt = n => (n ?? 0).toLocaleString("zh-CN");
const shortTime = s => (s || "").replace("T", " ").replace(/[+-]\d\d(:\d\d)?$/, "");

async function api(path) {
  const resp = await fetch(API + path, { headers: headers() });
  if (resp.status === 401 || resp.status === 403) {
    $('keyform').style.display = 'block';
    throw new Error("需要管理密钥");
  }
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return resp.json();
}
function bucketCards(b, suffix, t) {
  $('c-req' + suffix).textContent = fmt(b.requests);
  $('c-req-today').textContent = t;
  const rate = b.requests ? Math.round(100 * b.success / b.requests) : null;
  $('c-rate' + suffix).textContent = rate === null ? "–" : rate + "%";
  $('c-rate-today').textContent = t;
  $('c-in' + suffix).textContent = shortNum(b.input_tokens);
  $('c-in-today').textContent = t;
  $('c-out' + suffix).textContent = shortNum(b.output_tokens);
  $('c-out-today').textContent = t;
  $('c-total' + suffix).textContent = shortNum(b.total_tokens);
  $('c-total-today').textContent = t;
}
function renderModelOptions(summary) {
  const options = summary.model_options || [];
  const sel = $('f-model');
  sel.innerHTML = '<option value="">全部模型</option>' +
    options.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  if (filters.model && options.includes(filters.model)) {
    sel.value = filters.model;
  } else {
    if (filters.model) { filters.model = ""; saveFilters(); }
    sel.value = "";
  }
}
function shortNum(n) {
  n = n ?? 0;
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function render(summary, records) {
  $('content').style.display = '';
  syncFilterUI();
  renderModelOptions(summary);
  const label = filterLabel();
  bucketCards(summary.all, "", label + " · 本次进程内存");
  $('filter-hint').textContent = "筛选命中 " + fmt(summary.all.requests) + " 次请求";
  $('gen-at').textContent = ("记录窗口 " + summary.records + "/" + summary.window_cap +
       " · 更新于 " + new Date().toLocaleTimeString());
  const mb = $('models').tBodies[0];
  mb.innerHTML = "";
  if (!summary.models.length) mb.innerHTML = '<tr><td colspan="10" class="empty">暂无请求</td></tr>';
  for (const m of summary.models) {
    mb.insertAdjacentHTML("beforeend", `<tr>
      <td><span class="chip">${esc(m.model)}</span></td>
      <td class="num">${fmt(m.requests)}</td>
      <td class="num ok">${fmt(m.success)}</td>
      <td class="num ${m.failed ? 'bad' : ''}">${fmt(m.failed)}</td>
      <td class="num">${shortNum(m.input_tokens)}</td>
      <td class="num">${shortNum(m.output_tokens)}</td>
      <td class="num">${shortNum(m.reasoning_tokens)}</td>
      <td class="num">${shortNum(m.cached_tokens)}</td>
      <td class="num"><b>${shortNum(m.total_tokens)}</b></td>
      <td class="time">${shortTime(m.last_used)}</td></tr>`);
  }
  const tb = $('records').tBodies[0];
  tb.innerHTML = "";
  if (!(records.records || []).length) tb.innerHTML = '<tr><td colspan="10" class="empty">暂无请求</td></tr>';
  for (const r of records.records.slice().reverse()) {
    const type = r.stream ? '<span class="chip">流式</span>' : "非流式";
    const status = r.failed ? `<span class="bad">${r.status || "失败"}</span>` : '<span class="ok">OK</span>';
    tb.insertAdjacentHTML("beforeend", `<tr>
      <td class="time">${shortTime(r.time)}</td>
      <td>${esc(r.alias || r.model)}</td>
      <td>${type}</td>
      <td>${status}</td>
      <td class="num">${shortNum(r.input_tokens)}</td>
      <td class="num">${shortNum(r.output_tokens)}</td>
      <td class="num"><b>${shortNum(r.total_tokens)}</b></td>
      <td class="num">${r.latency_ms}ms</td>
      <td class="num">${r.ttft_ms || "-"}</td>
      <td class="time">${esc(r.api_key || "")}</td></tr>`);
  }
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function banner(msg) {
  const b = $('banner');
  if (!msg) { b.style.display = 'none'; return; }
  b.textContent = msg; b.style.display = 'block';
}
let timer = null;
async function load() {
  try {
    const [summary, records] = await Promise.all([
      api("/usage/summary" + filterQuery()),
      api("/usage/records" + filterQuery({ limit: "100" })),
    ]);
    banner(null);
    $('keyform').style.display = 'none';
    render(summary, records);
  } catch (e) {
    if (String(e.message) === "需要管理密钥") return;
    banner("加载失败：" + e.message);
  }
}
$('seg-range').onclick = ev => {
  const btn = ev.target.closest('button[data-range]');
  if (!btn || btn.dataset.range === filters.range) return;
  filters.range = btn.dataset.range;
  saveFilters();
  load();
};
$('f-model').onchange = ev => {
  filters.model = ev.target.value;
  saveFilters();
  load();
};
$('f-failed').onchange = ev => {
  filters.failed = ev.target.checked;
  saveFilters();
  load();
};
$('refresh').onclick = load;
$('auto').onchange = () => {
  if (timer) { clearInterval(timer); timer = null; }
  if ($('auto').checked) timer = setInterval(load, 10000);
};
$('keyform').onsubmit = ev => {
  ev.preventDefault();
  const k = $('key').value.trim();
  if (!k) return;
  try { sessionStorage.setItem(SS_KEY, k); } catch {}
  $('keyform').style.display = 'none';
  load();
};
timer = setInterval(load, 10000);
load();
</script>
</body>
</html>
